services:
  db:
    image: postgres:16
    container_name: betting-postgres
    environment:
      POSTGRES_DB: betting
      POSTGRES_USER: betting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - betting_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: betting-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/betting
      SPRING_DATASOURCE_USERNAME: betting
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN}
      ELEVEN_ELO_KEY: ${ELEVEN_ELO_KEY}
      BZZOIRO_KEY: ${BZZOIRO_KEY}

volumes:
  betting_pgdata:
    external: true