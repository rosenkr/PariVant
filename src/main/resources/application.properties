# --- Server ---
server.port=8080

# --- Datasource (local dev) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/betting
spring.datasource.username=betting
spring.datasource.password=betting

# --- JPA / Hibernate ---
# We use Flyway migrations as the source of truth for schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=INFO
spring.flyway.baseline-on-migrate=true