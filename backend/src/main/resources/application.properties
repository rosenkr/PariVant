# --- Server ---
server.port=8080

# --- Datasource (local dev) ---
# defined in compose... but 16 april on railway: need below
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# --- JPA / Hibernate ---
# We use Flyway migrations as the source of truth for schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=INFO
spring.flyway.baseline-on-migrate=true

# --- CORS (SPA) ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# Free API for ingesting data about football teams from 12 divisions, 10 calls per minute
footballdata.base-url=https://api.football-data.org/v4
footballdata.token=${FOOTBALL_DATA_TOKEN:}